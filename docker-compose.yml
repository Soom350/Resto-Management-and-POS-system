services:
  postgres:
    image: postgres:16-alpine
    container_name: rmts-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rmts}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rmts_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rmts}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rmts-net

  redis:
    image: redis:7-alpine
    container_name: rmts-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - rmts_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rmts-net

  nginx:
    image: nginx:1.27-alpine
    container_name: rmts-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rmts-net

volumes:
  rmts_postgres_data:
  rmts_redis_data:

networks:
  rmts-net:
    name: rmts-net
